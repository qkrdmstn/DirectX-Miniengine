<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MiniEngine 구조</title>
<style>
html, body { margin: 0; background: #F5F9FD; }
svg text { font-family: "Malgun Gothic", "맑은 고딕", sans-serif; }
.mono { font-family: Consolas, "Malgun Gothic", monospace; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F7590"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1A6BC4"/></marker>
  </defs>

  <text x="40" y="52" font-size="30" font-weight="700" fill="#12294A">MiniEngine 구조</text>
  <text x="40" y="82" font-size="15" fill="#5F7590">ModelViewer(실행 파일) → MeshCutting · Model · Core(정적 라이브러리) → Direct3D 12. 화살표는 코드 의존 방향 (ModelViewer의 세 화살표만 프로젝트 참조)</text>

  <!-- ===== ModelViewer ===== -->
  <rect x="40" y="110" width="1180" height="190" rx="14" fill="#12294A"/>
  <text x="64" y="146" font-size="24" font-weight="700" fill="#fff">ModelViewer</text>
  <text x="222" y="146" font-size="14" fill="#B9D3EE">앱 · GameCore::IGameApp 구현 · ModelViewer.cpp</text>
  <g font-size="14">
    <rect x="64" y="166" width="270" height="114" rx="10" fill="#1E3B63"/>
    <text x="80" y="192" font-weight="700" fill="#8CC8F2">Startup</text>
    <text x="80" y="216" fill="#D6E6F6">Renderer::Initialize</text>
    <text x="80" y="238" fill="#D6E6F6">IBL 텍스처 · 모델(.glb) 로드</text>
    <text x="80" y="260" fill="#D6E6F6">애니메이션 재생 · 카메라 설정</text>

    <rect x="350" y="166" width="270" height="114" rx="10" fill="#1E3B63"/>
    <text x="366" y="192" font-weight="700" fill="#8CC8F2">Update</text>
    <text x="366" y="216" fill="#D6E6F6">입력 · 카메라 이동</text>
    <text x="366" y="238" fill="#D6E6F6">ModelInstance::Update</text>
    <text x="366" y="260" fill="#D6E6F6">CutController::Update</text>

    <rect x="636" y="166" width="300" height="114" rx="10" fill="#1E3B63"/>
    <text x="652" y="192" font-weight="700" fill="#8CC8F2">RenderScene</text>
    <text x="652" y="216" fill="#D6E6F6">MeshSorter: Z pass → SSAO</text>
    <text x="652" y="238" fill="#D6E6F6">→ 그림자 맵 → 불투명 → 투명</text>
    <text x="652" y="260" fill="#D6E6F6">CutDebugView::Draw (절단 조각)</text>

    <rect x="952" y="166" width="250" height="114" rx="10" fill="#1E3B63"/>
    <text x="968" y="192" font-weight="700" fill="#8CC8F2">RenderUI</text>
    <text x="968" y="216" fill="#D6E6F6">화면 텍스트</text>
    <text x="968" y="238" fill="#D6E6F6">CutDebugView::DrawUI</text><text x="968" y="260" fill="#D6E6F6">(절단 계측 · 키 도움말)</text>
  </g>

  <!-- ===== 프레임 루프 ===== -->
  <rect x="1250" y="110" width="310" height="420" rx="14" fill="#fff" stroke="#DCE6F2" stroke-width="2"/>
  <text x="1272" y="144" font-size="19" font-weight="700" fill="#12294A">한 프레임 (주요 호출 순서)</text>
  <text x="1272" y="166" font-size="13" fill="#5F7590" class="mono">UpdateApplication()</text>
  <g font-size="14">
    <rect x="1280" y="184" width="250" height="40" rx="8" fill="#E8F2FC"/><text x="1296" y="210" fill="#12294A">① GameInput::Update</text>
    <rect x="1280" y="236" width="250" height="40" rx="8" fill="#E8F2FC"/><text x="1296" y="262" fill="#12294A">② app.Update</text>
    <rect x="1280" y="288" width="250" height="40" rx="8" fill="#E8F2FC"/><text x="1296" y="314" fill="#12294A">③ app.RenderScene</text>
    <rect x="1280" y="340" width="250" height="40" rx="8" fill="#E8F2FC"/><text x="1296" y="366" fill="#12294A">④ PostEffects::Render</text>
    <rect x="1280" y="392" width="250" height="40" rx="8" fill="#E8F2FC"/><text x="1296" y="418" fill="#12294A">⑤ app.RenderUI</text>
    <rect x="1280" y="444" width="250" height="40" rx="8" fill="#E8F2FC"/><text x="1296" y="470" fill="#12294A">⑥ Display::Present</text>
  </g>
  <g stroke="#1A6BC4" stroke-width="2" fill="none">
    <line x1="1405" y1="224" x2="1405" y2="234" marker-end="url(#arrB)"/>
    <line x1="1405" y1="276" x2="1405" y2="286" marker-end="url(#arrB)"/>
    <line x1="1405" y1="328" x2="1405" y2="338" marker-end="url(#arrB)"/>
    <line x1="1405" y1="380" x2="1405" y2="390" marker-end="url(#arrB)"/>
    <line x1="1405" y1="432" x2="1405" y2="442" marker-end="url(#arrB)"/>
  </g>
  <text x="1272" y="512" font-size="12.5" fill="#5F7590">②③⑤가 ModelViewer의 함수 (계측·튜닝 생략)</text>

  <!-- ===== Model ===== -->
  <rect x="40" y="350" width="560" height="260" rx="14" fill="#fff" stroke="#1A6BC4" stroke-width="2.5"/>
  <text x="64" y="386" font-size="24" font-weight="700" fill="#12294A">Model</text>
  <text x="152" y="386" font-size="14" fill="#5F7590">모델 · 애니메이션 · 기본 렌더러</text>
  <g font-size="14">
    <text x="64" y="420" fill="#12294A" class="mono">Model / ModelInstance</text>
    <text x="262" y="420" fill="#5F7590">노드 그래프 · 인스턴스 위치·크기</text>
    <text x="262" y="442" fill="#5F7590">스키닝 행렬 계산</text>
    <text x="64" y="476" fill="#12294A" class="mono">Animation</text>
    <text x="262" y="476" fill="#5F7590">키프레임 보간 · 재생 상태</text>
    <text x="64" y="510" fill="#12294A" class="mono">ModelLoader · glTF</text>
    <text x="262" y="510" fill="#5F7590">.glb 읽기 → .mini 캐시 변환·저장</text>
    <text x="64" y="544" fill="#12294A" class="mono">Renderer · MeshSorter</text>
    <text x="262" y="544" fill="#5F7590">패스별 정렬·그리기 (Z · 그림자 · 불투명)</text>
    <text x="64" y="578" fill="#12294A" class="mono">LightManager</text>
    <text x="262" y="578" fill="#5F7590">조명 · 라이트 그리드 (IBL은 Renderer)</text>
  </g>

  <!-- ===== MeshCutting ===== -->
  <rect x="640" y="350" width="580" height="220" rx="14" fill="#FFF7EA" stroke="#E3B26B" stroke-width="2.5"/>
  <text x="664" y="386" font-size="24" font-weight="700" fill="#12294A">MeshCutting</text>
  <text x="826" y="386" font-size="14" fill="#5F7590">연구 모듈 · 메시 절단</text>
  <g font-size="13.5">
    <text x="664" y="416" fill="#12294A" class="mono">CutController</text>
    <text x="834" y="416" fill="#5F7590">후보 찾기 · Enter 확정 · 원본 숨김 · 관절 분리 모사</text>
    <text x="664" y="442" fill="#12294A" class="mono">ProceduralMesh</text>
    <text x="834" y="442" fill="#5F7590">복사·절단·표시 공통 메시</text>
    <text x="664" y="468" fill="#12294A" class="mono">StaticMeshCopy</text>
    <text x="834" y="468" fill="#5F7590">원본 → ProceduralMesh 복사 (BonePatch: 본 범위)</text>
    <text x="664" y="494" fill="#12294A" class="mono">Geometry</text>
    <text x="834" y="494" fill="#5F7590">Slice · SliceCap · CutPlane · CutPick · Skinning</text>
    <text x="664" y="520" fill="#12294A" class="mono">Rendering</text>
    <text x="834" y="520" fill="#5F7590">ProceduralMeshRenderer · RenderBake</text>
    <text x="664" y="546" fill="#12294A" class="mono">Debug</text>
    <text x="834" y="546" fill="#5F7590">CutDebugView · SceneViewCamera</text>
  </g>

  <!-- ===== Core ===== -->
  <rect x="640" y="600" width="920" height="210" rx="14" fill="#fff" stroke="#1A6BC4" stroke-width="2.5"/>
  <text x="664" y="636" font-size="24" font-weight="700" fill="#12294A">Core</text>
  <text x="740" y="636" font-size="14" fill="#5F7590">엔진 기반</text>
  <g font-size="14">
    <rect x="664" y="652" width="270" height="148" rx="10" fill="#F2F5F9"/>
    <text x="678" y="676" font-weight="700" fill="#12294A">앱 · 입력 · 수학</text>
    <text x="678" y="700" fill="#5F7590" class="mono">GameCore</text><text x="774" y="700" fill="#5F7590">메인 루프</text>
    <text x="678" y="722" fill="#5F7590" class="mono">GameInput</text><text x="774" y="722" fill="#5F7590">DirectInput</text>
    <text x="678" y="744" fill="#5F7590" class="mono">Camera · Math</text>
    <text x="678" y="766" fill="#5F7590" class="mono">EngineProfiling · TextRenderer</text>

    <rect x="946" y="652" width="300" height="148" rx="10" fill="#F2F5F9"/>
    <text x="960" y="676" font-weight="700" fill="#12294A">그래픽 기반</text>
    <text x="960" y="700" fill="#5F7590" class="mono">GraphicsCore · Display</text>
    <text x="960" y="722" fill="#5F7590" class="mono">CommandContext · CommandListManager</text>
    <text x="960" y="744" fill="#5F7590" class="mono">GpuBuffer · ColorBuffer · DepthBuffer</text>
    <text x="960" y="766" fill="#5F7590" class="mono">PipelineState · RootSignature</text><text x="960" y="788" fill="#5F7590" class="mono">DescriptorHeap</text>

    <rect x="1258" y="652" width="286" height="148" rx="10" fill="#F2F5F9"/>
    <text x="1272" y="676" font-weight="700" fill="#12294A">후처리 · 효과</text>
    <text x="1272" y="700" fill="#5F7590" class="mono">SSAO · ShadowBuffer</text>
    <text x="1272" y="722" fill="#5F7590" class="mono">PostEffects (HDR · Bloom)</text>
    <text x="1272" y="744" fill="#5F7590" class="mono">FXAA · TemporalEffects</text>
    <text x="1272" y="766" fill="#5F7590" class="mono">MotionBlur · Particles</text>
  </g>

  <!-- ===== D3D12 ===== -->
  <rect x="40" y="840" width="1520" height="54" rx="12" fill="#12294A"/>
  <text x="800" y="874" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Direct3D 12 · DXGI · DirectInput (Windows)</text>

  <!-- ===== 의존 화살표 ===== -->
  <g stroke="#5F7590" stroke-width="2.5" fill="none">
    <line x1="320" y1="302" x2="320" y2="346" marker-end="url(#arr)"/>
    <line x1="930" y1="302" x2="930" y2="346" marker-end="url(#arr)"/>
    <line x1="1236" y1="302" x2="1236" y2="596" marker-end="url(#arr)"/>
    <line x1="638" y1="430" x2="604" y2="430" marker-end="url(#arr)"/>
    <line x1="930" y1="572" x2="930" y2="596" marker-end="url(#arr)"/>
    <path d="M602 540 L 620 540 L 620 720 L 636 720" marker-end="url(#arr)"/>
    <line x1="1100" y1="812" x2="1100" y2="836" marker-end="url(#arr)"/>
  </g>
  <g font-size="13" fill="#5F7590">
    <text x="332" y="330">모델 로드 · 업데이트 · 그리기</text>
    <text x="942" y="330">절단 갱신 · 조각 그리기</text>
    <text x="1244" y="580">메인 루프 · 입력 · 효과</text>
    <text x="606" y="420" font-size="11.5">사용</text>
    <text x="628" y="592" font-size="12">CommandContext · 버퍼 · PSO</text>
  </g>
</svg>
</body>
</html>
